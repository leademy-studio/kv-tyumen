resolver 127.0.0.11 valid=10s;

# Static files bypass PHP, but must use the same public origin without changing case.
map "$host:$http_x_forwarded_proto" $redirect_static_mirror {
    default 0;
    "kv-tyumen.ru:" 1;
    "kv-tyumen.ru:http" 1;
    ~^www\.kv-tyumen\.ru: 1;
}

map $host $public_origin {
    default "";
    kv-tyumen.ru https://kv-tyumen.ru;
    www.kv-tyumen.ru https://kv-tyumen.ru;
}

server {
    listen 80;
    server_name kv-tyumen.ru www.kv-tyumen.ru;
    root /var/www/html;
    index index.php index.html index.htm;

    include /etc/nginx/mime.types;
    client_max_body_size 100M;

    # Блокировка доступа к служебным файлам и директориям
    location ~ /\. {
        deny all;
    }

    # Блокировка доступа к чувствительным файлам October CMS
    location ~* ^/(config|vendor|storage/cms/cache|storage/framework|themes/.*/(bin|node_modules|tests)) {
        deny all;
    }

    # Compatibility for cached repairs pages after moving assets into shared folders.
    location ~ ^/themes/kv-vopros/assets/repairs/(css|js)/(.+)$ {
        absolute_redirect off;
        return 301 $public_origin/themes/kv-vopros/assets/$1/$2$is_args$args;
    }

    location ~ ^/themes/kv-vopros/assets/repairs/img/(.+)$ {
        absolute_redirect off;
        return 301 $public_origin/themes/kv-vopros/assets/images/$1$is_args$args;
    }

    # Обработка статических файлов с длительным кэшированием
    location ~* ^/(themes|storage)/.+\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|avif)$ {
        if ($redirect_static_mirror) { return 301 https://kv-tyumen.ru$request_uri; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Dynamic maps always reach October, even if an obsolete XML file remains on disk.
    location = /sitemap.xml {
        rewrite ^ /index.php last;
    }
    location = /sitemap-store.xml {
        rewrite ^ /index.php last;
    }

    # Основная конфигурация для October CMS (front-controller)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Обработка PHP файлов через php-fpm
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Используем переменную для динамического разрешения DNS контейнера app
        set $upstream app:9000;
        fastcgi_pass $upstream;
        
        fastcgi_index index.php;
        include fastcgi_params;
        
        # Передаем заголовок X-Forwarded-Proto от Traefik в PHP-FPM.
        # Это нужно, чтобы Laravel/October знал, что исходный запрос был по HTTPS.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Other public documents keep their exact path, filename and query string.
    location ~* \.[^/]+$ {
        if ($redirect_static_mirror) { return 301 https://kv-tyumen.ru$request_uri; }
        try_files $uri /index.php?$query_string;
    }

}
