# Статическая конфигурация Traefik

global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO # Для отладки можно временно поставить DEBUG

api:
  dashboard: true
  insecure: true # ВНИМАНИЕ: Не выставляйте порт 8080 наружу на боевом сервере без аутентификации

entryPoints:
  web:
    address: ":80"
    http:
      # The application returns a single redirect for origin, case and slashes.
      # Nginx still normalizes paths before filesystem access/security checks.
      sanitizePath: false
  websecure:
    address: ":443"
    http:
      sanitizePath: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: info@kv-tyumen.ru
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

providers:
  docker:
    exposedByDefault: false
