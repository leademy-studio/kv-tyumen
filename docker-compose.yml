services:
  # Сервис Traefik (обратный прокси)
  traefik:
    image: traefik:v3
    container_name: kv_vopros_traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Для доступа к Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/etc/traefik/acme.json
    networks:
      - kv_vopros_network

  # Сервис PHP-FPM (приложение)
  app:
    image: kv-vopros/app:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kv_vopros_app
    dns:
      - 8.8.8.8
    restart: unless-stopped
    env_file:
      - ./.env
      - ./october/.env
    volumes:
      - ./october:/var/www/html
      - ./october/.env:/var/www/html/.env:ro
      - ./php/fpm-observability.conf:/usr/local/etc/php-fpm.d/zz-observability.conf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kv_vopros_network

  # One bounded worker keeps image decoding out of web requests.
  image-worker:
    image: kv-vopros/app:${TAG:-latest}
    container_name: kv_vopros_image_worker
    restart: unless-stopped
    user: www-data
    entrypoint: ["php", "-d", "memory_limit=512M", "artisan"]
    command: ["queue:work", "images", "--queue=images", "--sleep=1", "--tries=3", "--timeout=120", "--memory=384", "--max-time=3600"]
    working_dir: /var/www/html
    env_file:
      - ./.env
      - ./october/.env
    volumes:
      - ./october:/var/www/html
    mem_limit: 640m
    cpus: 0.75
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kv_vopros_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Сервис Nginx (веб-сервер)
  nginx:
    image: nginx:alpine
    container_name: kv_vopros_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./october:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kv_vopros_network
    labels:
      - "traefik.enable=true"
      # Оба зеркала передаются приложению для единого 301
      - "traefik.http.routers.kv-vopros-app.rule=Host(`kv-tyumen.ru`) || Host(`www.kv-tyumen.ru`)"
      - "traefik.http.routers.kv-vopros-app.entrypoints=websecure"
      - "traefik.http.routers.kv-vopros-app.tls=true"
      - "traefik.http.routers.kv-vopros-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kv-vopros-app.service=kv-vopros-app"
      - "traefik.http.services.kv-vopros-app.loadbalancer.server.port=80"
      - "traefik.docker.network=kv_vopros_network"
      - "traefik.http.routers.kv-vopros-http.rule=Host(`kv-tyumen.ru`) || Host(`www.kv-tyumen.ru`)"
      - "traefik.http.routers.kv-vopros-http.entrypoints=web"
      - "traefik.http.routers.kv-vopros-http.service=kv-vopros-app"

  # Сервис базы данных MySQL
  db:
    image: mariadb:10.11 # Замена на MariaDB для лучшей совместимости с ARM (Apple M1/M2/M3)
    container_name: kv_vopros_db
    env_file:
      - ./.env
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD} # Пароль для root, если нужен
    volumes:
      - kv_vopros_db_data:/var/lib/mysql
    networks:
      - kv_vopros_network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10

  # Watchdog-сервис: проверяет доступность сайта и отправляет алерты в Telegram / MAX
  watchdog:
    image: curlimages/curl:8.12.1
    container_name: kv_vopros_watchdog
    restart: unless-stopped
    env_file:
      - ./.env
      - ./october/.env
    volumes:
      - ./scripts/server-alert-monitor.sh:/opt/server-alert-monitor.sh:ro
    command: ["/bin/sh", "/opt/server-alert-monitor.sh"]
    networks:
      - kv_vopros_network

networks:
  kv_vopros_network:
    name: kv_vopros_network

volumes:
  kv_vopros_db_data:
    name: kv_vopros_db_data
    driver: local
