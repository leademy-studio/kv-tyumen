{% set aboutVideo = aboutVideo ?? { type: 'vk', vk_id: '-211347773_456239038' } %}

{% if aboutVideo.type == 'kinescope' and aboutVideo.kinescope_id %}
    <style>
        .tn-atom__video-play-link {
            display: none !important;
        }
    </style>
    <div class="tn-atom__videoiframe" style="width:100%; height:100%;">
        <iframe
            src="https://kinescope.io/embed/{{ aboutVideo.kinescope_id }}"
            style="width:100%; height:100%; border:0;"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            title="Видео о компании"
        ></iframe>
    </div>
{% else %}
    {% set vkId = aboutVideo.vk_id ?: '-211347773_456239038' %}
    <div class="tn-atom__videoiframe" data-vkvideoid="{{ vkId }}" style="width:100%; height:100%;"></div>
{% endif %}
