    _template_help:
        label: Шаблон пакетного ремонта
        type: section
        comment: Изображения, вводный блок и этапы наследуются от страницы «Пакетный ремонт», если оставить их пустыми.
            SEO-текст и FAQ заполняются отдельно для каждой страницы. Тарифы общие; кейсы можно выбрать на вкладке «Заявка и портфолио».
        tab: Страница
    meta_title:
