        type: text
        required: true
        tab: Страница
    slug:
        label: Адрес страницы
        type: slug
        preset:
            field: title
        required: true
        validation: required|regex:/^[a-z0-9]+(?:-[a-z0-9]+)*$/
        commentAbove: 'Латиница, цифры и дефисы. Например: remont-odnokomnatnoj-kvartiry. Адрес: /repairs/remont-odnokomnatnoj-kvartiry.'
